<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mehr Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">
        🌊 Mehr Store
    </div>

    <div class="search-box">
        <input type="text" placeholder="جستجوی برنامه..." id="search">
    </div>
</header>


<section class="hero">

    <h1>فروشگاه برنامه مهر</h1>

    <p>
        برنامه‌های مورد نیاز خود را ساده و سریع پیدا کنید
    </p>

</section>


<section class="categories">

    <button>🔥 محبوب</button>
    <button>🎮 بازی</button>
    <button>📱 کاربردی</button>
    <button>🎵 موسیقی</button>
    <button>🛠 ابزار</button>

</section>


<section class="apps" id="apps">


    <div class="app-card">

        <img src="https://cdn-icons-png.flaticon.com/512/888/888857.png">

        <div class="info">

            <h2>Telegram</h2>

            <p>
                پیام‌رسان سریع و امن
            </p>

            <span>
                نسخه: 10.0
            </span>

            <button>
                دانلود
            </button>

        </div>

    </div>



    <div class="app-card">

        <img src="https://cdn-icons-png.flaticon.com/512/732/732228.png">

        <div class="info">

            <h2>Spotify</h2>

            <p>
                گوش دادن به موسیقی
            </p>

            <span>
                نسخه: 9.5
            </span>

            <button>
                دانلود
            </button>

        </div>

    </div>



    <div class="app-card">

        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968292.png">

        <div class="info">

            <h2>Chrome</h2>

            <p>
                مرورگر اینترنت
            </p>

            <span>
                نسخه: 120
            </span>

            <button>
                دانلود
            </button>

        </div>

    </div>


</section>



<footer>

    <p>
        © 2026 Mehr Store | ساخته شده با ❤️
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
